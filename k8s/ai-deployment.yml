apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ai-deployment
  labels:
    name:  ai-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      name:  ai-server
  template:
    metadata:
      labels:
        name:  ai-server
    spec:
      containers:
      - image:  ai-orchestration
        name:  ai-server  
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-database
              key: GEMINI_API_KEY
        - name: MISTRALAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-database
              key: MISTRALAI_API_KEY
        resources:
          requests:
            cpu: "250m"
            memory: "128M"
          limits:
            cpu: "500m"
            memory: "256M"
        livenessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10  
        ports:
        - containerPort:  3000
          name:  ai-server-port
